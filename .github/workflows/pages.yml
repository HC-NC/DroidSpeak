name: Deploy Web Playground to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'DroidSpeak.Core/**'
      - 'DroidSpeak.Web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish Blazor WebAssembly
        run: dotnet publish DroidSpeak.Web/DroidSpeak.Web.csproj -c Release -o ./gh-pages-out

      - name: Prepare static files for GitHub Pages
        run: |
          sed -i 's/<base href="\/" \/>/<base href="\/DroidSpeak\/" \/>/g' ./gh-pages-out/wwwroot/index.html
          cp ./gh-pages-out/wwwroot/index.html ./gh-pages-out/wwwroot/404.html
          touch ./gh-pages-out/wwwroot/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./gh-pages-out/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
