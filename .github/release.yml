changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: 🚀 Features
      labels:
        - feat
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - fix
        - bug
    - title: 🔊 DSP & Audio Improvements
      labels:
        - audio
        - dsp
    - title: 📦 Maintenance & Docs
      labels:
        - "*"
